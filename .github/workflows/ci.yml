name: CI

on:
  push:
    branches: [main]
  # No `branches:` filter here on purpose (#801). That filter matches the PR's
  # *base*, so gating it on `main` exempted every stacked PR — a PR based on a
  # feature branch ran only `cla` and still showed a green tick. It hid a real
  # bug through five PRs. Every PR gets the matrix, whatever it targets.
  pull_request:
  schedule:
    # Weekly nightly run (Mon 00:00 UTC) to catch env-drift / flaky tests
    # against fresh upstream dependencies, independent of PR/push activity.
    # TODO: wire failure notifications once an alerting convention exists
    # (see issue #539 follow-up — no slack/issues alert path defined yet).
    - cron: "0 0 * * 1"

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        # SQL extras (postgres / mysql / clickhouse / sqlserver) ensure the
        # destination test suites actually run in CI rather than being silently
        # skipped by their `pytest.importorskip(...)` guards (#596 / #340
        # follow-up). sqlserver joined them in #862: the driver-double fidelity
        # pins are worthless while they skip, and pymssql ships manylinux
        # wheels so it costs no toolchain.
        # snowflake is omitted — its tests use sys.modules injection so the
        # heavy snowflake-connector-python install would only slow CI.
        # bigquery / gcs / s3 / parquet remain opt-in for the same reason. GCS
        # and S3 additionally must stay out of *this* install: their destination
        # suites assert the no-extras ImportError messages with sys.modules
        # injection. Once the real SDK package has been loaded in this process,
        # those tests no longer isolate the missing-extra path reliably. The
        # object_store_smoke steps install each SDK separately after this run
        # and target only that backend's integration module (#756).
        # dev supplies testcontainers, so local_sql_smoke/object_store_smoke
        # run against the runner's Docker daemon on every PR without secrets.
        run: uv pip install --system -e ".[dev,mcp,duckdb,postgres,mysql,clickhouse,sqlserver]"

      - name: Dependency vulnerability scan (pip-audit)
        # Pinned version for reproducibility; bump in lockstep with Dependabot.
        # OSV is the vulnerability service used by GitHub Advisory DB and is
        # broader than PyPI-only sources for the Python ecosystem.
        # `--strict` makes pip-audit exit non-zero on warnings (e.g. skipped
        # packages) so silent gaps in coverage surface as CI failures.
        # Run on a single matrix entry (3.12) to avoid 4x duplicated work —
        # vuln data is python-version-independent.
        if: matrix.python-version == '3.12'
        run: |
          # GitHub-hosted runners may ship a pip version with a known OSV
          # advisory (e.g. PYSEC-2026-196 against pip<26.1.2). Upgrade before
          # scanning so the audit passes cleanly without contributor PRs
          # tripping on environmental pip vulns unrelated to their changes.
          pip install --upgrade "pip>=26.1.2"
          pip install "pip-audit==2.10.0"
          # Allow-list: pass `--ignore-vuln GHSA-xxxx` here when a finding is
          # triaged as a known false positive. Keep this list empty by default
          # and document each entry in SECURITY.md.
          pip-audit \
            --strict \
            --vulnerability-service osv

      - name: Lint (ruff)
        run: ruff check drt tests

      - name: Type check (mypy)
        run: mypy drt

      - name: Check skills sync
        run: make check-skills

      - name: Check CHANGELOG covers all tagged versions
        # Requires git fetch --unshallow so the script can see v* tags
        # (checkout@v6 uses a shallow clone by default; tags are not
        # fetched). The check itself is fast — pure Python + one
        # git tag invocation.
        if: matrix.python-version == '3.12'
        run: |
          git fetch --tags --quiet
          make check-changelog

      - name: Check CHANGELOG entry on code-touching PR (warn-only)
        # Surfaces a warning — does NOT block merge — when a PR touches
        # drt/ or pyproject.toml without adding a CHANGELOG.md entry.
        # Bypass: dependabot (auto), or include `[skip changelog]` in
        # the PR description (CI/dep bumps, i18n marker updates).
        # See scripts/check_changelog_required.py and CONTRIBUTING.md.
        if: |
          github.event_name == 'pull_request' &&
          matrix.python-version == '3.12' &&
          github.event.pull_request.user.login != 'dependabot[bot]' &&
          !contains(github.event.pull_request.body, '[skip changelog]')
        run: |
          git fetch origin main --quiet
          python3 scripts/check_changelog_required.py origin/main HEAD \
            || echo "::warning::CHANGELOG.md not updated for this code-touching PR. See CONTRIBUTING.md."

      - name: Test (pytest)
        run: pytest --cov=drt --cov-report=xml

      - name: Install gcs extra for object_store_smoke
        # Installed as its own late step, after the main test run above —
        # see the "Install dependencies" step's comment for why gcs cannot
        # be present for that run (it would make test_gcs_destination.py's
        # no-extras ImportError assertion pass for the wrong reason: import
        # success, not a mocked failure). Additive install; nothing above
        # this step needs to change.
        run: uv pip install --system -e ".[gcs]"

      - name: Test (object_store_smoke, pytest)
        run: pytest -m object_store_smoke tests/integration/object_store/test_gcs_backend.py

      - name: Install s3 extra for object_store_smoke
        # Keep boto3 out of the main test process so the S3 destination's
        # missing-extra assertion remains meaningful; see the install comment
        # above. This late additive install mirrors the GCS backend's layout.
        run: uv pip install --system -e ".[s3]"

      - name: Test (S3 object_store_smoke, pytest)
        run: pytest -m object_store_smoke tests/integration/object_store/test_s3_backend.py

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}

  dagster-drt-test:
    # integrations/dagster-drt/tests/ has never run in any CI job: the main
    # `test` job's `testpaths = ["tests"]` (root pyproject.toml) doesn't reach
    # it, and publish-dagster-drt.yml's `verify` job runs a bare `pytest` from
    # the repo root too — it re-runs drt-core's own suite, not this package's.
    # Found while touching dagster_drt/resource.py (v0.10, #855 prep). No
    # `paths:` filter on purpose — same reasoning as the top-of-file note on
    # `pull_request:` having no `branches:` filter (#801): a job that only
    # sometimes runs is how a real bug hides through five PRs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install drt-core (editable) + dagster-drt
        run: |
          uv pip install --system -e .
          uv pip install --system -e ./integrations/dagster-drt
          uv pip install --system pytest

      - name: Lint (ruff)
        run: ruff check integrations/dagster-drt

      - name: Type check (mypy)
        run: mypy integrations/dagster-drt/dagster_drt

      - name: Test (pytest)
        working-directory: integrations/dagster-drt
        run: pytest tests/ -q
