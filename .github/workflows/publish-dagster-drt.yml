name: Publish dagster-drt to PyPI

on:
  push:
    tags:
      - "dagster-drt-v*"

jobs:
  verify:
    # Re-run lint/type/tests against the tagged commit before publishing,
    # so a tag pushed off a stale local can never ship without verification.
    #
    # This job's install/lint/test steps below run drt-core's OWN suite
    # (root pyproject.toml's `testpaths = ["tests"]`) — that's what actually
    # gets published as a dependency, so it's worth pinning here too, but it
    # is NOT dagster-drt's own tests. Until this fix, that meant every
    # dagster-drt release shipped without dagster_drt/ itself ever being
    # linted, type-checked, or tested by this workflow — ci.yml's
    # `dagster-drt-test` job (added alongside this fix) now covers that on
    # every PR; the dedicated step below re-runs it at tag time too, on the
    # same "verify the exact tagged commit" principle as the drt-core steps.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv pip install --system -e ".[dev,mcp,duckdb,postgres,mysql,clickhouse,sqlserver]"

      - name: Lint (ruff)
        run: ruff check drt tests

      - name: Type check (mypy)
        run: mypy drt

      - name: Test (pytest)
        run: pytest

      - name: Install dagster-drt (editable)
        run: uv pip install --system -e ./integrations/dagster-drt

      - name: Lint dagster-drt (ruff)
        run: ruff check integrations/dagster-drt

      - name: Type check dagster-drt (mypy)
        run: mypy integrations/dagster-drt/dagster_drt

      - name: Test dagster-drt (pytest)
        working-directory: integrations/dagster-drt
        run: pytest tests/ -q

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # for Trusted Publishing (no API token needed)
      contents: write  # for uploading SBOM to the GitHub Release

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install dagster-drt (for SBOM scope)
        # Install the package itself so the SBOM captures its actual runtime
        # closure (dagster + drt-core + transitive deps), not the dev env.
        run: uv pip install --system ./integrations/dagster-drt

      - name: Generate CycloneDX SBOM
        run: |
          pip install "cyclonedx-bom==7.3.0"
          cyclonedx-py environment \
            --output-format JSON \
            --output-file dagster-drt-sbom.cdx.json \
            --pyproject integrations/dagster-drt/pyproject.toml
          python -c "import json; d=json.load(open('dagster-drt-sbom.cdx.json')); assert d.get('components'), 'SBOM has no components'"

      - name: Build dagster-drt
        working-directory: integrations/dagster-drt
        run: uv build

      - name: Publish dagster-drt to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: integrations/dagster-drt/dist/

      - name: Attach SBOM to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dagster-drt-sbom.cdx.json
          fail_on_unmatched_files: true
