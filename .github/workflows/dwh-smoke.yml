# DWH smoke validation — real-warehouse end-to-end checks (#674, part of #654).
#
# The cloud-warehouse destinations (Snowflake / Databricks / BigQuery) are
# CI-tested only with sys.modules-injected mocks — that covers drt's own logic
# but can't catch dialect-specific behaviour only a live service exercises.
# This workflow runs a minimal seeded-DuckDB -> engine -> real-warehouse sync
# and reads the rows back, mirroring the v0.7.5 DuckDB E2E harness.
#
# Credential-agnostic by design:
#   * Only runs on the upstream repo (forks have no secrets).
#   * Each job checks whether its DRT_SMOKE_* secrets are present and, if not,
#     no-ops green — so this is safe to merge before any secrets exist and
#     "activates" per-warehouse as masukai adds them.
# Cloud secrets + the "verified on a real service" sign-off are owned by the
# maintainer (his accounts / repo secrets); see #671 / #672 / #673.
#
# Required repo secrets (per warehouse) are listed in
# tests/integration/dwh/README.md.

name: dwh-smoke

on:
  workflow_dispatch:
  schedule:
    # Nightly 03:00 UTC — offset from CI (00:00) and the weekly audits.
    - cron: '0 3 * * *'

permissions:
  contents: read

jobs:
  snowflake:
    name: Snowflake smoke
    runs-on: ubuntu-latest
    if: github.repository == 'drt-hub/drt'
    # Serializes overlapping runs (nightly cron + manual workflow_dispatch)
    # against the shared smoke warehouse -- the warehouse-requirement probe
    # in test_snowflake_smoke.py deliberately SUSPENDs/RESUMEs it, and a
    # concurrent run's queries could race with that state manipulation,
    # producing a false finding or clobbering the other run's restore
    # (Codex review, #985). cancel-in-progress: false queues rather than
    # kills an in-flight run, which is safer than cancelling mid-ALTER.
    # Shared with cost-digest.yml's digest job: that workflow deliberately
    # piggybacks on this same warehouse right after this job (see its own
    # comment), and its usage-view query would auto-resume a warehouse this
    # job just suspended for the probe test -- producing a false regression
    # (or getting interrupted itself). Same group name, same reasoning
    # (Codex review, #985).
    concurrency:
      group: dwh-smoke-snowflake
      cancel-in-progress: false
    env:
      DRT_SMOKE_SNOWFLAKE_ACCOUNT: ${{ secrets.SMOKE_SNOWFLAKE_ACCOUNT }}
      DRT_SMOKE_SNOWFLAKE_USER: ${{ secrets.SMOKE_SNOWFLAKE_USER }}
      DRT_SMOKE_SNOWFLAKE_PASSWORD: ${{ secrets.SMOKE_SNOWFLAKE_PASSWORD }}
      DRT_SMOKE_SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SMOKE_SNOWFLAKE_PRIVATE_KEY }}
      DRT_SMOKE_SNOWFLAKE_DATABASE: ${{ secrets.SMOKE_SNOWFLAKE_DATABASE }}
      DRT_SMOKE_SNOWFLAKE_SCHEMA: ${{ secrets.SMOKE_SNOWFLAKE_SCHEMA }}
      DRT_SMOKE_SNOWFLAKE_WAREHOUSE: ${{ secrets.SMOKE_SNOWFLAKE_WAREHOUSE }}
    steps:
      - uses: actions/checkout@v7
      - name: Check credentials
        id: creds
        run: |
          if [ -z "$DRT_SMOKE_SNOWFLAKE_ACCOUNT" ]; then
            echo "No Snowflake smoke secrets configured — skipping (no-op)."
            echo "has_creds=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_creds=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up Python
        if: steps.creds.outputs.has_creds == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install uv
        if: steps.creds.outputs.has_creds == 'true'
        run: pip install uv
      - name: Install drt-core[dev,duckdb,snowflake]
        if: steps.creds.outputs.has_creds == 'true'
        run: uv pip install --system -e ".[dev,duckdb,snowflake]"
      - name: Run Snowflake smoke
        if: steps.creds.outputs.has_creds == 'true'
        run: pytest -m dwh_smoke tests/integration/dwh/test_snowflake_smoke.py -v

  databricks:
    name: Databricks smoke
    runs-on: ubuntu-latest
    if: github.repository == 'drt-hub/drt'
    env:
      DRT_SMOKE_DATABRICKS_HOST: ${{ secrets.SMOKE_DATABRICKS_HOST }}
      DRT_SMOKE_DATABRICKS_HTTP_PATH: ${{ secrets.SMOKE_DATABRICKS_HTTP_PATH }}
      DRT_SMOKE_DATABRICKS_TOKEN: ${{ secrets.SMOKE_DATABRICKS_TOKEN }}
      DRT_SMOKE_DATABRICKS_CATALOG: ${{ secrets.SMOKE_DATABRICKS_CATALOG }}
      DRT_SMOKE_DATABRICKS_SCHEMA: ${{ secrets.SMOKE_DATABRICKS_SCHEMA }}
    steps:
      - uses: actions/checkout@v7
      - name: Check credentials
        id: creds
        run: |
          if [ -z "$DRT_SMOKE_DATABRICKS_HOST" ]; then
            echo "No Databricks smoke secrets configured — skipping (no-op)."
            echo "has_creds=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_creds=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up Python
        if: steps.creds.outputs.has_creds == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install uv
        if: steps.creds.outputs.has_creds == 'true'
        run: pip install uv
      - name: Install drt-core[dev,duckdb,databricks]
        if: steps.creds.outputs.has_creds == 'true'
        run: uv pip install --system -e ".[dev,duckdb,databricks]"
      # The smoke warehouse auto-stops after idle time, and the databricks-sql-
      # connector's implicit auto-start-on-connect proved unreliable against it
      # (observed 2026-08-27: repeated `BAD_REQUEST: Cannot create the resource,
      # please try again later` at session-open, three attempts over ~10h, while
      # a manual Start from the Databricks UI succeeded immediately and let the
      # very next run pass). Start it explicitly via the REST API and wait for
      # RUNNING before handing off to pytest, rather than relying on the SQL
      # client to trigger and outlast a cold start on its own.
      - name: Start Databricks SQL warehouse and wait until running
        if: steps.creds.outputs.has_creds == 'true'
        run: |
          # No `set -e`: every failure point below is handled explicitly.
          # `curl -sf ... | jq` inside the polling loop must NOT abort the
          # whole step on one transient 429/5xx/network blip -- that would
          # spend none of the 300s budget the loop exists to provide (Codex
          # review, #1015).
          set -uo pipefail
          warehouse_id="${DRT_SMOKE_DATABRICKS_HTTP_PATH##*/}"
          api="https://${DRT_SMOKE_DATABRICKS_HOST}/api/2.0/sql/warehouses/${warehouse_id}"
          auth=(-H "Authorization: Bearer ${DRT_SMOKE_DATABRICKS_TOKEN}")

          # A short bounded retry for the two one-shot calls below (initial
          # status check, start request) -- separate from the polling loop's
          # own longer-running retry budget, so neither call fails the whole
          # job over a single bad response.
          curl_retry() {
            local attempt
            for attempt in 1 2 3; do
              if curl -sf "${auth[@]}" "$@"; then
                return 0
              fi
              sleep 3
            done
            return 1
          }

          state=""
          if ! state=$(curl_retry "$api" | jq -r '.state'); then
            echo "::error::Could not reach the Databricks SQL Warehouses API to check status"
            exit 1
          fi
          echo "Warehouse ${warehouse_id} current state: ${state}"

          if [ "$state" != "RUNNING" ]; then
            echo "Starting warehouse..."
            if ! curl_retry -X POST "${api}/start" >/dev/null; then
              echo "::error::Failed to request warehouse start"
              exit 1
            fi

            deadline=$((SECONDS + 300))
            while [ "$SECONDS" -lt "$deadline" ]; do
              if new_state=$(curl -sf "${auth[@]}" "$api" | jq -r '.state'); then
                state="$new_state"
                echo "  state=${state} (${SECONDS}s elapsed)"
                if [ "$state" = "RUNNING" ]; then
                  break
                fi
              else
                echo "  status check failed transiently, retrying... (${SECONDS}s elapsed)"
              fi
              sleep 10
            done

            if [ "$state" != "RUNNING" ]; then
              echo "::error::Warehouse did not reach RUNNING within 300s (last state: ${state})"
              exit 1
            fi
          fi
          echo "Warehouse is running."
      - name: Run Databricks smoke
        if: steps.creds.outputs.has_creds == 'true'
        run: pytest -m dwh_smoke tests/integration/dwh/test_databricks_smoke.py -v

  bigquery:
    name: BigQuery smoke
    runs-on: ubuntu-latest
    if: github.repository == 'drt-hub/drt'
    env:
      DRT_SMOKE_BIGQUERY_PROJECT: ${{ secrets.SMOKE_BIGQUERY_PROJECT }}
      DRT_SMOKE_BIGQUERY_DATASET: ${{ secrets.SMOKE_BIGQUERY_DATASET }}
      # Service-account JSON (whole file contents) stored as a secret.
      SMOKE_BIGQUERY_KEYFILE_JSON: ${{ secrets.SMOKE_BIGQUERY_KEYFILE_JSON }}
    steps:
      - uses: actions/checkout@v7
      - name: Check credentials
        id: creds
        run: |
          if [ -z "$DRT_SMOKE_BIGQUERY_PROJECT" ]; then
            echo "No BigQuery smoke secrets configured — skipping (no-op)."
            echo "has_creds=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_creds=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up Python
        if: steps.creds.outputs.has_creds == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install uv
        if: steps.creds.outputs.has_creds == 'true'
        run: pip install uv
      - name: Install drt-core[dev,duckdb,bigquery]
        if: steps.creds.outputs.has_creds == 'true'
        run: uv pip install --system -e ".[dev,duckdb,bigquery]"
      - name: Write service-account keyfile
        if: steps.creds.outputs.has_creds == 'true'
        run: |
          echo "$SMOKE_BIGQUERY_KEYFILE_JSON" > "$RUNNER_TEMP/bq-sa.json"
          echo "DRT_SMOKE_BIGQUERY_KEYFILE=$RUNNER_TEMP/bq-sa.json" >> "$GITHUB_ENV"
      - name: Run BigQuery smoke
        if: steps.creds.outputs.has_creds == 'true'
        run: pytest -m dwh_smoke tests/integration/dwh/test_bigquery_smoke.py -v
