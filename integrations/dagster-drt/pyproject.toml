[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dagster-drt"
version = "0.5.0"
description = "Community-maintained Dagster integration for drt (data reverse tool)"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = [
    "dagster>=1.10.18",  # current defs.yaml Components API + per-project dg CLI contract
    # resource.py/assets.py call run_sync(idempotency_ledger=..., audit_trail=...)
    # and read StateBundle.ledger/.audit_trail unconditionally — APIs added by
    # #1099/#1100. The placeholder floor this comment used to describe
    # (0.11.0, picked deliberately too high rather than too low while
    # #1099/#1100 were still `[Unreleased]` and no next version number was
    # named) turned out to never apply: drt-core went 0.10.0 -> 1.0.0
    # directly, and #1099/#1100 ship in that same 1.0.0 release. Corrected
    # to the actual tag now that it exists.
    "drt-core>=1.0.0",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
