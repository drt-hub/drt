[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dagster-drt"
version = "0.5.0"
description = "Community-maintained Dagster integration for drt (data reverse tool)"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = [
    "dagster>=1.10.18",  # current defs.yaml Components API + per-project dg CLI contract
    # resource.py/assets.py call run_sync(idempotency_ledger=..., audit_trail=...)
    # and read StateBundle.ledger/.audit_trail unconditionally — APIs added by
    # #1099/#1100, still `[Unreleased]` as of this floor bump (no drt-core tag
    # contains them yet; ROADMAP.md names no next version either). 0.11.0 is a
    # forward-looking floor, not a confirmed release number — deliberately
    # picked too high rather than too low: an over-high floor just fails to
    # resolve at install time (loud, and this integration isn't published
    # against this code yet, so the blast radius is zero); the old 0.9.1
    # floor let a real install through that crashes with AttributeError/
    # TypeError on the first sync (caught in Codex review on #1126). Correct
    # this to the actual tag once drt-core ships a release containing
    # #1099/#1100.
    "drt-core>=0.11.0",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
