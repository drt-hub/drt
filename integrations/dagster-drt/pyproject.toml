[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dagster-drt"
version = "0.5.0"
description = "Community-maintained Dagster integration for drt (data reverse tool)"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = [
    "dagster>=1.10.18",  # current defs.yaml Components API + per-project dg CLI contract
    "drt-core>=0.9.1",  # 0.9.0's StatePersistingObserver advanced the watermark on dry runs (#978, fixed in 0.9.1)
    # KNOWN GAP (caught in Codex review on #1126, not yet fixed): resource.py
    # and assets.py now call run_sync(idempotency_ledger=..., audit_trail=...)
    # and read StateBundle.ledger/.audit_trail — APIs added by #1099/#1100,
    # which are still `[Unreleased]` in drt-core's CHANGELOG as of this
    # comment (post-v0.10.0, no tag contains them yet). There is no already-
    # released drt-core version to raise this floor to. Do NOT cut/publish a
    # new dagster-drt release against the current 0.9.1 floor while that's
    # true — a floor-satisfying (0.9.1–0.10.0) install has neither API, so
    # every dagster-drt sync would crash before executing, even with the
    # features disabled. Raise this floor to the first drt-core release that
    # contains #1099/#1100 once one is tagged, then this comment can go.
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
